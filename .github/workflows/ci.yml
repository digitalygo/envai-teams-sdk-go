name: SDK CI
on:
  push:
    branches: [dev, alpha, beta, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: envai
          POSTGRES_PASSWORD: envai-test-only
          POSTGRES_DB: envai_sdk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U envai -d envai_sdk_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ENVAI_TEST_POSTGRES_DSN: postgres://envai:envai-test-only@localhost:5432/envai_sdk_test?sslmode=disable
    strategy:
      matrix:
        go: ['1.24.x', '1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/check_contracts.py
      - run: python scripts/test_check_contracts.py
      - run: python scripts/generate.py && gofmt -w models_generated.go operations_generated.go events_generated.go open_models_generated_test.go && git diff --exit-code
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: python scripts/check_coverage.py coverage.out
      - if: matrix.go == '1.27.x'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  release-checks:
    name: Release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix .github/release-tools
      - run: node .github/release-tools/patch-semantic-release.mjs
      - run: npm test --prefix .github/release-tools
      - run: npm audit --audit-level=high --prefix .github/release-tools

  release:
    needs: [test, release-checks]
    if: github.event_name == 'push' && contains(fromJSON('["dev", "alpha", "beta", "main"]'), github.ref_name)
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      KCHAT_WEBHOOK_URL: ${{ secrets.KCHAT_WEBHOOK_URL }}
